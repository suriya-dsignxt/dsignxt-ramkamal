<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramkamal Design Presentation Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loader" aria-hidden="true">
        <div class="spinner"></div>
    </div>

    <nav class="sidebar" aria-label="Presentation pages">
        <div class="brand-logo">RAMKAMAL</div>
        <div class="nav-items-container" id="nav-list"></div>
    </nav>

    <main>
        <div class="mockup-container" id="mockup-container">
            <img src="" alt="Ramkamal design mockup" class="mockup-image" id="mockup-img">
        </div>
    </main>

    <div class="version-switcher" id="switcher" aria-label="Design version switcher">
        <button class="switcher-btn" type="button" data-version="v1">Version 1</button>
        <button class="switcher-btn" type="button" data-version="v2">Version 2</button>
        <button class="switcher-btn" type="button" data-version="mobile">Mobile</button>
    </div>

    <div class="controls" aria-label="Page navigation">
        <div class="page-indicator" id="page-num">01 / 14</div>
        <button class="control-btn" type="button" id="prev-btn">Prev</button>
        <button class="control-btn" type="button" id="next-btn">Next</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
